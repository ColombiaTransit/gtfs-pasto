name: Analyze Ruti APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/analyze-apk.yml', 'scripts/extract_bundle.py', 'scripts/extract_records.py', 'scripts/analyze_dataset.py', 'scripts/inventory_datasets.py']
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and verify source
        run: |
          mkdir -p "$RUNNER_TEMP/ruti" research-output
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/ruti/source.xapk" 'https://github.com/ColombiaTransit/gtfs-pasto/releases/download/source-ruti-2.0.0/Ruti%2BSETP_2.0.0.xapk'
          echo "1a5880770f24f193acf7c6bf58f8412a8bd8c9a45ffd0d374a28efdfb545d797  $RUNNER_TEMP/ruti/source.xapk" | sha256sum -c -
          python scripts/extract_bundle.py "$RUNNER_TEMP/ruti/source.xapk" "$RUNNER_TEMP/ruti"
          cp "$RUNNER_TEMP/ruti/extraction-report.json" research-output/
      - name: Install Hermes tools
        run: python -m pip install hermes-dec==0.1.2
      - name: Disassemble and decompile
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ruti"
          hbc-disassembler index.android.bundle ruti.hasm
          hbc-decompiler index.android.bundle ruti.js
          test -s ruti.hasm
          test -s ruti.js
          python -c 'import json,pathlib; print(json.dumps({p.name:p.stat().st_size for p in [pathlib.Path("ruti.hasm"),pathlib.Path("ruti.js")]}))' > "$GITHUB_WORKSPACE/research-output/decompilation-report.json"
      - name: Extract transport records
        run: python scripts/extract_records.py "$RUNNER_TEMP/ruti/index.android.bundle" research-output
      - name: Audit route and schedule data
        run: python scripts/analyze_dataset.py research-output "$RUNNER_TEMP/ruti/ruti.js"
      - name: Inventory embedded datasets
        run: python scripts/inventory_datasets.py "$RUNNER_TEMP/ruti/index.android.bundle" research-output "$RUNNER_TEMP/ruti/ruti.js"
      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruti-analysis-report
          path: research-output/
          retention-days: 7
          if-no-files-found: warn
